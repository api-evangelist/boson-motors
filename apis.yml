aid: boson-motors
name: Boson Motors
description: Boson Motors is an electric vehicle and robotics company founded in 2017, building a modular
  electric off-road utility vehicle (UTV) platform for agriculture, farm automation, and work applications.
  Its flagship LX40 is a user-serviceable, low-maintenance electric 4WD UTV that charges from a standard
  110v outlet and accepts interchangeable work modules for spraying, hauling, and crew transport. The
  company operates engineering and production out of Tada, Andhra Pradesh, India, with a strategic base
  in Fremont, California, and maintains a robotics arm (Boson Robotics) focused on autonomous and
  agricultural automation. Boson Motors is a Techstars-backed portfolio company. As of this profile it
  publishes a consumer marketing and reservation site with no public developer program, API, SDK, or
  developer documentation; its public engineering footprint is a GitHub organization of ROS/robotics
  libraries. This profile is maintained as an API Evangelist network lead and enrichment target.
